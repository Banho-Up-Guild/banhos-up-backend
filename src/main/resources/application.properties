spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banhosup}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# PARA ACESSAR O BANCO DE DADOS SIGA OS PASSOS ABAIXO:
! Utilizem o PostgreSQL 16+.
! Crie um banco vazio chamado banhosup (tudo minusculo).
! se sua porta for diferente de 5432, defina ela nas variaveis de ambiente do intellij:
! DB_PASSWORD: senha do seu usuario postgres
! DB_URL: sua porta
! Para colocar duas variaveis, separe elas por com ponto e virgula ;
! Rode a BackendApplication.